
# ==========================================
# REDIS DEPLOYMENT
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

---
# ==========================================
# REDIS SERVICE
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP

---
# ==========================================
# FLASK DEPLOYMENT
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: visitor-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: visitor-web
  template:
    metadata:
      labels:
        app: visitor-web
    spec:
      containers:
        - name: visitor-web
          image: visitor-counter:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: REDIS_HOST
              value: redis-service
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20

---
# ==========================================
# FLASK NODEPORT SERVICE
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: visitor-web
spec:
  type: NodePort
  selector:
    app: visitor-web
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
